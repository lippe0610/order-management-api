version: '3.8'

services:
  # Servicio principal de la API
  order-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-management-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Order Management API
      - VERSION=1.0.0
      - DEBUG=false
      - ALLOWED_ORIGINS=["*"]
    volumes:
      # Montar logs (opcional)
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx como proxy reverso (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: order-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Para certificados SSL
    depends_on:
      - order-api
    restart: unless-stopped
    networks:
      - order-network
    profiles:
      - production  # Solo se ejecuta con --profile production

networks:
  order-network:
    driver: bridge

volumes:
  logs:
    driver: local

